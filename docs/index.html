<!doctype html>
<html lang="en" data-color-theme="pocket-atlas" data-component-theme="rounded" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Big Tech Club is a free field guide to AI engineering and a directory of the people who practice it.">
  <meta name="theme-color" content="#f6f3e9">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Big Tech Club</title>
  <script>
    (() => {
      try {
        const mode = localStorage.getItem('bigtechclub-theme') || 'system';
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = mode === 'dark' || (mode === 'system' && dark) ? 'dark' : 'light';
        document.documentElement.dataset.themeMode = mode;
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <script type="module" crossorigin src="./assets/main-CXOP7nWK.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/preload-helper-DIbePYYx.js">
</head>
<body>
  <div id="root"></div>
</body>
</html>
